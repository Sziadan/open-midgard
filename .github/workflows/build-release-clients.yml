name: Build Release Clients

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-clients-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-qt:
    name: Build Windows Qt x64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python for Qt install
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Qt 6.8 MinGW toolchain
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.*" "py7zr==1.0.*"
          python -m aqt install-qt windows desktop 6.8.3 win64_mingw --outputdir C:\Qt
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir C:\Qt

          $qtRoot = Join-Path "C:\Qt" "6.8.3\mingw_64"
          $mingwBin = "C:\Qt\Tools\mingw1310_64\bin"

          if (-not (Test-Path -LiteralPath (Join-Path $mingwBin "g++.exe"))) {
            throw "Failed to locate the Qt-compatible MinGW 13.1 compiler"
          }

          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $qtRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=1.4.341 --yes --no-progress

          $vulkanRoot = Get-ChildItem -Path "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $vulkanRoot) {
            throw "Failed to locate Vulkan SDK under C:\VulkanSDK after installation"
          }

          if (-not (Test-Path (Join-Path $vulkanRoot "Include\vulkan\vulkan.h"))) {
            throw "Installed Vulkan SDK is missing Include\vulkan\vulkan.h"
          }

          "VULKAN_SDK=$vulkanRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $vulkanRoot "Bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Windows Qt release
        shell: pwsh
        run: |
          cmake --preset mingw-qt-x64-ci `
            -DCMAKE_BUILD_TYPE=Release `
            "-DRO_QT_ROOT=$env:QT_ROOT_DIR" `
            "-DCMAKE_C_COMPILER=$env:MINGW_BIN/gcc.exe" `
            "-DCMAKE_CXX_COMPILER=$env:MINGW_BIN/g++.exe" `
            "-DCMAKE_MAKE_PROGRAM=$env:MINGW_BIN/mingw32-make.exe"

      - name: Build Windows Qt release
        shell: pwsh
        run: cmake --build --preset build-mingw-qt-x64-ci --parallel 4

      - name: Check world cleanup regression
        shell: pwsh
        run: python tools/tests/check_world_cleanup.py --cxx "$env:MINGW_BIN/g++.exe"

      - name: Check watchdog lifecycle
        shell: pwsh
        run: python tools/tests/check_watchdog.py --cxx "$env:MINGW_BIN/g++.exe"

      - name: Check map-label encoding
        shell: pwsh
        run: python tools/tests/check_map_label_encoding.py --cxx "$env:MINGW_BIN/g++.exe"

      - name: Package Windows Qt release
        shell: pwsh
        run: |
          $assetName = "open-midgard-windows-qt-x64"
          $buildDir = Join-Path $PWD "build-mingw-preset"
          $stagingDir = Join-Path $env:RUNNER_TEMP $assetName
          $zipPath = Join-Path $env:RUNNER_TEMP "$assetName.zip"

          foreach ($required in @("open-midgard.exe", "qt.conf", "Qt6Core.dll", "Qt6Quick.dll",
              "libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll",
              "thirdparty/qt/platforms/qwindows.dll", "thirdparty/qt/qml/QtQuick/qmldir", "licenses/qt")) {
            if (-not (Test-Path -LiteralPath (Join-Path $buildDir $required))) {
              throw "Release runtime is incomplete: $required"
            }
          }

          New-Item -ItemType Directory -Path $stagingDir | Out-Null
          Copy-Item (Join-Path $buildDir "open-midgard.exe") $stagingDir
          Copy-Item -LiteralPath LICENSE,README.md -Destination $stagingDir

          Get-ChildItem -Path $buildDir -Filter "*.dll" -File | Copy-Item -Destination $stagingDir

          if (Test-Path (Join-Path $buildDir "qt.conf")) {
            Copy-Item (Join-Path $buildDir "qt.conf") $stagingDir
          }

          foreach ($dirName in @("licenses", "thirdparty")) {
            $sourceDir = Join-Path $buildDir $dirName
            if (Test-Path $sourceDir) {
              Copy-Item $sourceDir $stagingDir -Recurse
            }
          }

          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipPath

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: open-midgard-windows-qt-x64
          path: ${{ runner.temp }}/open-midgard-windows-qt-x64.zip
          if-no-files-found: error

  build-linux-qt-vulkan:
    name: Build Linux Qt Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qtqml \
            qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Configure Linux Qt Vulkan release
        shell: bash
        run: cmake --preset linux-qt-vulkan

      - name: Build Linux Qt Vulkan release
        shell: bash
        run: cmake --build --preset build-linux-qt-vulkan --parallel "$(nproc)"

      - name: Check world cleanup regression
        shell: bash
        run: python3 tools/tests/check_world_cleanup.py --cxx g++

      - name: Check watchdog lifecycle
        shell: bash
        run: python3 tools/tests/check_watchdog.py --cxx g++

      - name: Check map-label encoding
        shell: bash
        run: python3 tools/tests/check_map_label_encoding.py --cxx g++

      - name: Package Linux Qt Vulkan release
        shell: bash
        run: |
          set -euxo pipefail

          asset_name="open-midgard-linux-qt-vulkan"
          build_dir="$GITHUB_WORKSPACE/build-linux-qt-vulkan"
          staging_dir="$RUNNER_TEMP/$asset_name"
          tar_path="$RUNNER_TEMP/$asset_name.tar.gz"

          mkdir -p "$staging_dir/lib" "$staging_dir/plugins" "$staging_dir/qml" "$staging_dir/translations" "$staging_dir/licenses"

          cp "$build_dir/open-midgard" "$staging_dir/open-midgard-bin"
          cp -a "$GITHUB_WORKSPACE/third_party/qt" "$staging_dir/licenses/qt"
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/README.md" "$staging_dir/"

          cat > "$staging_dir/open-midgard" <<'EOF'
          #!/usr/bin/env bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$SCRIPT_DIR/plugins"
          export QML2_IMPORT_PATH="$SCRIPT_DIR/qml"
          export QML_IMPORT_PATH="$SCRIPT_DIR/qml"
          exec "$SCRIPT_DIR/open-midgard-bin" "$@"
          EOF
          chmod +x "$staging_dir/open-midgard" "$staging_dir/open-midgard-bin"

          cat > "$staging_dir/qt.conf" <<'EOF'
          [Paths]
          Plugins = plugins
          Imports = qml
          Qml2Imports = qml
          Translations = translations
          EOF

          qmake_bin="$(command -v qmake6 || command -v qmake)"
          qt_lib_dir="$($qmake_bin -query QT_INSTALL_LIBS)"
          qt_plugin_dir="$($qmake_bin -query QT_INSTALL_PLUGINS)"
          qt_qml_dir="$($qmake_bin -query QT_INSTALL_QML)"
          qt_translation_dir="$($qmake_bin -query QT_INSTALL_TRANSLATIONS)"

          for plugin_dir in \
            egldeviceintegrations \
            iconengines \
            imageformats \
            networkinformation \
            platforms \
            platforminputcontexts \
            platformthemes \
            tls \
            wayland-decoration-client \
            wayland-graphics-integration-client \
            wayland-shell-integration \
            xcbglintegrations; do
            if [ -d "$qt_plugin_dir/$plugin_dir" ]; then
              cp -a "$qt_plugin_dir/$plugin_dir" "$staging_dir/plugins/"
            fi
          done

          for qml_dir in QML Qt QtQml QtQuick; do
            if [ -d "$qt_qml_dir/$qml_dir" ]; then
              cp -a "$qt_qml_dir/$qml_dir" "$staging_dir/qml/"
            fi
          done

          if [ -d "$qt_translation_dir" ]; then
            find "$qt_translation_dir" -maxdepth 1 -type f -name 'qt_*.qm' -exec cp -a {} "$staging_dir/translations/" \;
          fi

          copy_runtime_deps() {
            local target="$1"
            local dependencies
            dependencies="$(ldd "$target")"
            if grep -q '=> not found' <<< "$dependencies"; then
              printf 'Unresolved runtime dependencies in %s:\n%s\n' "$target" "$dependencies" >&2
              return 1
            fi
            awk '/=> \// { print $3 } /^\// { print $1 }' <<< "$dependencies" | while read -r dep_path; do
              if [ -z "$dep_path" ] || [ ! -f "$dep_path" ]; then
                continue
              fi
              case "$(basename "$dep_path")" in
                linux-vdso.so.*|ld-linux*.so*|libc.so.*|libdl.so.*|libgcc_s.so.*|libm.so.*|libpthread.so.*|librt.so.*|libresolv.so.*|libstdc++.so.*|libutil.so.*)
                  continue
                  ;;
              esac
              cp -aL "$dep_path" "$staging_dir/lib/"
            done
          }

          copy_runtime_deps "$staging_dir/open-midgard-bin"
          find "$staging_dir/plugins" "$staging_dir/qml" -type f \( -name '*.so' -o -name '*.so.*' \) -print0 | while IFS= read -r -d '' so_path; do
            copy_runtime_deps "$so_path"
          done

          find "$qt_lib_dir" -maxdepth 1 -type f \( -name 'libQt6*.so*' -o -name 'libicu*.so*' \) -exec cp -aL {} "$staging_dir/lib/" \;

          test -s "$staging_dir/plugins/platforms/libqxcb.so"
          test -s "$staging_dir/qml/QtQuick/qmldir"
          test -s "$staging_dir/qml/QtQml/WorkerScript/qmldir"
          LD_LIBRARY_PATH="$staging_dir/lib" ldd "$staging_dir/open-midgard-bin" > "$RUNNER_TEMP/linux-release-ldd.txt"
          if grep -q '=> not found' "$RUNNER_TEMP/linux-release-ldd.txt"; then
            cat "$RUNNER_TEMP/linux-release-ldd.txt" >&2
            exit 1
          fi

          tar -C "$RUNNER_TEMP" -czf "$tar_path" "$asset_name"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: open-midgard-linux-qt-vulkan
          path: ${{ runner.temp }}/open-midgard-linux-qt-vulkan.tar.gz
          if-no-files-found: error

  attach-to-release:
    name: Attach release assets
    if: github.event_name == 'release'
    needs:
      - build-windows-qt
      - build-linux-qt-vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: open-midgard-*
          merge-multiple: true

      - name: Upload assets to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum open-midgard-windows-qt-x64.zip open-midgard-linux-qt-vulkan.tar.gz > SHA256SUMS
          gh release upload "$RELEASE_TAG" \
            open-midgard-windows-qt-x64.zip \
            open-midgard-linux-qt-vulkan.tar.gz \
            SHA256SUMS \
            --clobber
